<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1a33'/%3E%3Cpath d='M8 9l8 15 8-15h-4.6L16 15.8 12.6 9z' fill='%23dca638'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VITECH School Management System — manage students, teachers, attendance, grades, fees, communication and school operations from one powerful platform." />
    <meta name="theme-color" content="#0a1226" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>VITECH School — Complete School Management System</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f1f4fa;font-family:'Public Sans',system-ui,sans-serif;">
        <div style="width:52px;height:52px;border-radius:14px;background:#0c1a33;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M8 9l8 15 8-15h-4.6L16 15.8 12.6 9z" fill="#dca638"/></svg>
        </div>
        <div id="boot-title" style="font-weight:700;color:#101d38;font-size:15px;">Loading VITECH School…</div>
        <div style="width:180px;height:4px;border-radius:999px;background:#dde5f2;overflow:hidden;">
          <div style="width:40%;height:100%;border-radius:999px;background:#2b5ce9;animation:bootbar 1.1s ease-in-out infinite;"></div>
        </div>
        <div id="boot-err" style="display:none;max-width:480px;margin:0 24px;background:#fff;border:1px solid #fecaca;border-radius:12px;padding:14px 16px;color:#b91c1c;font-size:12.5px;line-height:1.5;box-shadow:0 10px 28px -18px rgb(10 18 38/.25);"></div>
        <style>@keyframes bootbar{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}</style>
      </div>
    </div>
    <div id="print-sheet"></div>
    <noscript><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f4fa;font-family:system-ui,sans-serif;color:#101d38;text-align:center;padding:24px;"><p><strong>JavaScript is required.</strong><br/>VITECH School needs JavaScript to run. Please enable it.</p></div></noscript>
    <script>
      /* Surface fatal load-time errors on the boot screen instead of freezing. */
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-err");
        var t = document.getElementById("boot-title");
        if (el && document.getElementById("boot")) {
          el.style.display = "block";
          el.innerHTML = "<strong>Startup error</strong><br/>" + (e.message || "Unknown error") +
            (e.filename ? "<br/><span style='color:#9a3412'>" + e.filename + " (line " + (e.lineno || "?") + ")</span>" : "") +
            "<br/><span style='color:#6b7280'>Open the browser console (F12) for details, or clear site data &amp; reload.</span>";
          if (t) t.textContent = "VITECH School hit a problem while loading";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
